                      大图轮播 · 自动播放 · 左右键或点击缩略图切换
                    </p>
                  </div>

                  {/* 大图放映台 */}
                  <div className="my-5 relative aspect-[16/9] sm:aspect-[21/9] w-full rounded-xl overflow-hidden bg-black border border-zinc-800 group/gallery">
                    <img
                      src={surpriseGallery[activeSlide].src}
                      alt={surpriseGallery[activeSlide].title}
                      className="w-full h-full object-cover transition-all duration-700"
                    />

                    {/* 左右切图交互 */}
                    <div className="absolute inset-0 flex items-center justify-between p-3 opacity-0 group-hover/gallery:opacity-100 transition-opacity">
                      <button
                        onClick={() => setActiveSlide((prev) => (prev - 1 + surpriseGallery.length) % surpriseGallery.length)}
                        className="w-8 h-8 rounded-full bg-black/70 backdrop-blur border border-zinc-700 flex items-center justify-center text-white hover:bg-white hover:text-black transition"
                        title="上一张"
                      >
                        <Icons.ChevronLeft />
                      </button>
                      <button
                        onClick={() => setActiveSlide((prev) => (prev + 1) % surpriseGallery.length)}
                        className="w-8 h-8 rounded-full bg-black/70 backdrop-blur border border-zinc-700 flex items-center justify-center text-white hover:bg-white hover:text-black transition"
                        title="下一张"
                      >
                        <Icons.ChevronRight />
                      </button>
                    </div>

                    {/* 底部信息浮条 */}
                    <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black via-black/60 to-transparent p-4 flex items-end justify-between font-mono text-xs">
                      <div>
                        <div className="text-zinc-200 font-semibold tracking-wider">
                          {surpriseGallery[activeSlide].title}
                        </div>
                        <div className="text-[11px] text-zinc-400 font-sans mt-0.5">
                          {surpriseGallery[activeSlide].desc}
                        </div>
                      </div>
                      <button
                        onClick={() => setIsPlaying(!isPlaying)}
                        className="text-[11px] text-zinc-300 hover:text-white flex items-center gap-1.5 bg-black/70 px-2.5 py-1 rounded border border-zinc-700"
                      >
                        {isPlaying ? (
                          <>
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping" />
                            AUTO_STREAM
                          </>
                        ) : (
                          <>
                            <Icons.Play /> RESUME
                          </>
                        )}
                      </button>
                    </div>
                  </div>

                  {/* 缩略图快速点选 */}
                  <div className="grid grid-cols-6 gap-2">
                    {surpriseGallery.map((img, idx) => (
                      <button
                        key={idx}
                        onClick={() => {
                          setActiveSlide(idx);
                          setIsPlaying(false);
                        }}
                        className={`relative aspect-video rounded-md overflow-hidden border transition-all ${
                          activeSlide === idx
                            ? "border-white ring-1 ring-white/50 opacity-100 scale-[1.03]"
                            : "border-zinc-800 opacity-40 hover:opacity-80"
                        }`}
                      >
                        <img src={img.src} alt="" className="w-full h-full object-cover" />
                      </button>
                    ))}
                  </div>
                </div>
              </div>

            </div>
          </main>

          {/* 视频弹窗 (Video Modal) */}
          {videoModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="relative w-full max-w-3xl bg-zinc-950 border border-zinc-800 rounded-2xl overflow-hidden p-4">
                <div className="flex justify-between items-center mb-3 font-mono text-xs text-zinc-400">
                  <span>VIDEO // 晓晓专属回忆</span>
                  <button
                    onClick={() => setVideoModalOpen(false)}
                    className="px-2 py-0.5 rounded bg-zinc-800 text-zinc-200 hover:bg-zinc-700 text-xs"
                  >
                    ESC / 关闭
                  </button>
                </div>
                <video
                  src="photo/E8BDA801E70B17EB87E80A8A73B85851.mp4"
                  poster="photo/0B6E5D590B0E5FF060E793C20749F2FF.jpg"
                  controls
                  autoPlay
                  className="w-full rounded-xl border border-zinc-900 max-h-[70vh] bg-black"
                />
              </div>
            </div>
          )}

          {/* 底部 Footer */}
          <footer className="border-t border-zinc-800/80 py-10 px-6 bg-black text-center font-mono text-xs text-zinc-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="text-zinc-300 font-semibold">HER.LOSER.DEV</span>
                <span>//</span>
                <span>FOR TIAN XIAOXIAO</span>
              </div>
              <div className="text-zinc-600">
                CONFIDENTIAL // 2002-2026 // ALL MEMORIES ENCRYPTED & PRESERVED
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
