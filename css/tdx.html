    <footer class="site-footer" id="lifeFooter">2002.11.17</footer>
  </div>

  <script>
    (function () {
      // 生日 2002-11-17，页面按 2026-11-21 这一天计算
      var birth = new Date(2002, 10, 17);
      var asOf = new Date(2026, 10, 21);

      var start = Date.UTC(birth.getFullYear(), birth.getMonth(), birth.getDate());
      var end = Date.UTC(asOf.getFullYear(), asOf.getMonth(), asOf.getDate());
      var days = Math.round((end - start) / 86400000);

      var age = asOf.getFullYear() - birth.getFullYear();
      var md = asOf.getMonth() - birth.getMonth();
      if (md < 0 || (md === 0 && asOf.getDate() < birth.getDate())) {
        age--;
      }

      var daysText = days.toLocaleString("zh-CN");
      var line = "已走过 " + daysText + " 天 · " + age + " 岁";
      var dateLine = "2026.11.21";

      var stats = document.getElementById("lifeStats");
      var foot = document.getElementById("lifeFooter");
      if (stats) stats.textContent = dateLine + "  ·  " + line;
      if (foot) foot.textContent = "2002.11.17  →  2026.11.21  ·  " + line;
    })();
  </script>
